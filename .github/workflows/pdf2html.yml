name: Batch PDF to HTML Conversion
on:
  push:
    paths:
      - '**/*.pdf'

jobs:
  pdf2html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pdfminer.six

      - name: Convert PDFs to HTML
        run: |
          for pdf in $(find . -name '*.pdf'); do
            out="${pdf%.pdf}.html"
            text=$(python3 -c "from pdfminer.high_level import extract_text; import sys; print(extract_text(sys.argv[1]));" "$pdf")
            echo "<html><body><pre>${text}</pre></body></html>" > "$out"
          done

      - name: Upload HTML outputs
        uses: actions/upload-artifact@v4
        with:
          name: html-files
          path: '**/*.html'
